{% extends 'base.html' %}

{% block title %}Submit Project — Student Success Initiative{% endblock %}

{% block content %}
<section class="section" style="padding: 30px 0 60px 0;">
    <div class="container" style="max-width: 600px;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="display: inline-block; background: var(--light-green); color: var(--deep-green); font-size: 11px; font-weight: 700; padding: 4px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border: 1px solid #c8dfcd;">
                💻 SSI Showcase
            </div>
            <h2 style="font-size: 28px; color: var(--deep-green); margin: 0 0 6px 0; font-weight: 800;">Share Your Project</h2>
            <p style="color: #465248; font-size: 13.5px; margin: 0;">Show off your technical work, GitHub repo, or application to the community.</p>
        </div>

        <div style="background: var(--white); border-radius: 16px; border: 1px solid #e2e8e3; padding: 36px; box-shadow: 0 8px 30px rgba(2, 62, 36, 0.04);">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Project Title</label>
                    <input type="text" name="title" required placeholder="e.g. Daily Habit & Mood Tracker" style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Tech Stack / Tools Used</label>
                    <input type="text" name="tech_stack" required placeholder="e.g. Python, Playwright, Next.js, Django" style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Project / GitHub URL</label>
                    <input type="url" name="project_url" placeholder="https://github.com/your-username/project" style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Screenshot / Preview Image</label>
                    <input type="file" name="screenshot" style="width: 100%; padding: 8px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13px; background: var(--soft-gray); box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Project Description</label>
                    <textarea name="description" rows="4" required placeholder="Describe what your project does, key features, and what you learned..." style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; font-size: 14px; font-weight: 700; text-align: center;">
                    🚀 Publish to Showcase
                </button>

            </form>
        </div>

    </div>
</section>
{% endblock %}
