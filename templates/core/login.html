{% extends 'base.html' %}

{% block title %}Member Login — Student Success Initiative{% endblock %}

{% block content %}
<section class="section" style="padding: 30px 0 60px 0;">
    <div class="container" style="max-width: 500px;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="display: inline-block; background: var(--light-green); color: var(--deep-green); font-size: 11px; font-weight: 700; padding: 4px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border: 1px solid #c8dfcd;">
                🔐 Secure Portal
            </div>
            <h2 style="font-size: 32px; color: var(--deep-green); margin: 0 0 6px 0; font-weight: 800;">Member Login</h2>
            <p style="color: #465248; font-size: 13.5px; margin: 0;">Access your registered masterclasses and profile.</p>
        </div>

        <div style="background: var(--white); border-radius: 16px; border: 1px solid #e2e8e3; padding: 36px; box-shadow: 0 8px 30px rgba(2, 62, 36, 0.04);">
            <form method="POST">
                {% csrf_token %}
                {{ form.non_field_errors }}
                
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Username</label>
                    <input type="text" name="username" required placeholder="Enter your username" style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                </div>

                <!-- BI-12 Fix: Password field with Show/Hide toggle -->
                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Password</label>
                    <div style="position: relative;">
                        <input type="password" name="password" id="login_password" required placeholder="Enter your password" style="width: 100%; padding: 10px 40px 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                        <span onclick="toggleLoginPassword()" id="loginEyeIcon" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px;" title="Show/Hide Password">👁️</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 16px;">
                    🔑 Login to Dashboard
                </button>

                <div style="text-align: center; font-size: 13px; color: #465248;">
                    Don't have an account? <a href="{% url 'member_signup' %}" style="color: var(--ssi-green); font-weight: 700; text-decoration: none;">Sign up here</a>
                </div>
            </form>
        </div>

    </div>
</section>

<!-- Script for Show/Hide Password functionality on Login -->
<script>
    function toggleLoginPassword() {
        const field = document.getElementById('login_password');
        const icon = document.getElementById('loginEyeIcon');
        if (field.type === "password") {
            field.type = "text";
            icon.textContent = "🙈";
        } else {
            field.type = "password";
            icon.textContent = "👁️";
        }
    }
</script>
{% endblock %}
