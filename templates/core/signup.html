{% extends 'base.html' %}

{% block title %}Student Signup — Student Success Initiative{% endblock %}

{% block content %}
<section class="section" style="padding: 30px 0 60px 0;">
    <div class="container" style="max-width: 550px;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="display: inline-block; background: var(--light-green); color: var(--deep-green); font-size: 11px; font-weight: 700; padding: 4px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border: 1px solid #c8dfcd;">
                🚀 Join SSI Hub
            </div>
            <h2 style="font-size: 32px; color: var(--deep-green); margin: 0 0 6px 0; font-weight: 800;">Create Account</h2>
            <p style="color: #465248; font-size: 13.5px; margin: 0;">Register to track your masterclass registrations.</p>
        </div>

        <div style="background: var(--white); border-radius: 16px; border: 1px solid #e2e8e3; padding: 36px; box-shadow: 0 8px 30px rgba(2, 62, 36, 0.04);">
            <form method="POST">
                {% csrf_token %}
                
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Username</label>
                    <input type="text" name="username" required placeholder="Choose a username" style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Email Address</label>
                    <input type="email" name="email" required placeholder="Enter your email" style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                    <div>
                        <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">University</label>
                        <input type="text" name="university" placeholder="e.g., NUST / FAST" style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Department</label>
                        <input type="text" name="department" placeholder="e.g., Software Engineering" style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                    </div>
                </div>

                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--deep-green); margin-bottom: 6px;">Password</label>
                    <input type="password" name="password" required placeholder="Create a password" style="width: 100%; padding: 10px 14px; border: 1px solid #d1ded3; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 16px;">
                    ✨ Register Account
                </button>

                <div style="text-align: center; font-size: 13px; color: #465248;">
                    Already have an account? <a href="{% url 'member_login' %}" style="color: var(--ssi-green); font-weight: 700; text-decoration: none;">Login here</a>
                </div>
            </form>
        </div>

    </div>
</section>
{% endblock %}
